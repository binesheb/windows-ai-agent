server:
  host: 127.0.0.1
  port: 8765

security:
  mode: read_only
  remote_connections: false

filesystem:
  # Relative roots are resolved from the agent working directory.
  # Additional roots can be supplied later through an explicit configuration change.
  allowed_roots:
    - .
  max_read_bytes: 1048576
  max_entries: 500

logging:
  audit_file: logs/audit.jsonl
